name: local-wealth-tests
on:
  workflow_dispatch:
  push:
    paths:
      - "local_wealth/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q local_wealth/tests
