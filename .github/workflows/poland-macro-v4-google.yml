name: Poland Macro v4 Google CPI
on:
  push:
    branches: [poland-macro-v4-challenger-20260909]
    paths: ['v4/google_challenger.py', '.github/workflows/poland-macro-v4-google.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'timesfm[torch]==3.0.0' numpy pandas requests safetensors
      - run: python -u v4/google_challenger.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poland-macro-v4-google
          path: v4_google/
          if-no-files-found: error
