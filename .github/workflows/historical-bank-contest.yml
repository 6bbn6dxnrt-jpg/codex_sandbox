name: Historical bank forecast sources
on:
  push:
    branches: [poland-macro-bank-backtest-20260917]
    paths: ['history_contest/acquire.py', '.github/workflows/historical-bank-contest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests lxml pymupdf
      - run: python -u history_contest/acquire.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-bank-sources-20260917
          path: history_sources/
          retention-days: 90
          if-no-files-found: error
