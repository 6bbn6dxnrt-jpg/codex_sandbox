name: Poland Macro v2 GDP ablation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TimesFM 3
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'timesfm[torch]==3.0.0' pandas numpy requests safetensors
      - name: Run GDP ablation
        run: python timesfm_poland_macro_v2_ablation.py
      - name: Upload ablation
        uses: actions/upload-artifact@v4
        with:
          name: poland-macro-v2-ablation
          path: |
            poland_macro_v2_ablation.json
            poland_macro_v2_ablation.csv
