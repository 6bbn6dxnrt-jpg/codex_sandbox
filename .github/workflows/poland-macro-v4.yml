name: Poland Macro v4 challenger
on:
  push:
    branches: [poland-macro-v4-challenger-20260909]
    paths: ['v4/**', '.github/workflows/poland-macro-v4.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poland-macro-v4
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests lxml
      - run: python -u v4/acquire.py
      - run: python -u v4/extra.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poland-macro-v4-data
          path: v4_run/
          if-no-files-found: error
