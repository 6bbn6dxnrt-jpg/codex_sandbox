name: TimesFM3 smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TimesFM with PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'timesfm[torch]' huggingface_hub
          python -m pip show timesfm

      - name: Run actual TimesFM-3 inference
        env:
          HF_HUB_DISABLE_XET: '0'
        run: |
          cat > smoke.py <<'PY'
          import json, numpy as np
          from timesfm3 import TimesFM3Evaluator, ModelConfig
          config = ModelConfig(
              checkpoint_path='google/timesfm-3.0-pytorch',
              per_core_batch_size=1,
              device='cpu'
          )
          forecaster = TimesFM3Evaluator(config)
          t = np.arange(128, dtype=np.float32)
          target = np.stack([
              0.02*t + np.sin(t/6.0),
              0.01*t + np.cos(t/8.0),
              np.sin(t/12.0) + 0.4*np.cos(t/5.0),
          ]).astype(np.float32)
          outputs = list(forecaster.predict_batch(
              contexts=[target], horizon=8,
              return_quantiles=True,
              use_symmetric_averaging=False))
          o = outputs[0]
          result = {
              'model': 'google/timesfm-3.0-pytorch',
              'forecast_shape': list(o.forecast.shape),
              'quantiles_shape': list(o.quantiles.shape),
              'forecast': np.asarray(o.forecast).tolist(),
              'quantiles': np.asarray(o.quantiles).tolist(),
          }
          with open('timesfm3_smoke.json','w') as f: json.dump(result,f,indent=2)
          print(json.dumps(result, indent=2))
          PY
          python smoke.py

      - name: Upload smoke result
        uses: actions/upload-artifact@v4
        with:
          name: timesfm3-smoke
          path: timesfm3_smoke.json
